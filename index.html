<script>
/* ── Streaming links ────────────────────────────────────────────────
   Paste the two URLs between the quotes. Any platform left empty is
   hidden automatically, so the page never shows a dead button.
   ─────────────────────────────────────────────────────────────────── */
const LINKS = {
  apple:   "https://music.apple.com/us/album/the-message-single/6838480344",
  youtube: "https://music.youtube.com/watch?v=p61U0iRbv8c",
  spotify: ""
};

const NAMES = { apple: "Apple Music", youtube: "YouTube Music", spotify: "Spotify" };
const live = [];

for (const [key, url] of Object.entries(LINKS)) {
  if (!url || url === "#") continue;
  const el = document.querySelector('[data-platform="' + key + '"]');
  if (el) { el.href = url; el.hidden = false; live.push(NAMES[key]); }
}

const note = document.getElementById("listen-note");
if (live.length === 1)      note.textContent = "Listen on " + live[0] + ".";
else if (live.length === 2) note.textContent = "Listen on " + live[0] + " and " + live[1] + ".";
else if (live.length > 2)   note.textContent = "Listen on " + live.slice(0,-1).join(", ") + " and " + live[live.length-1] + ".";
else                        note.textContent = "";
</script>

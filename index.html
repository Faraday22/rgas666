<style>
  :root { color-scheme: dark; --gold:#b8935a; --ink:#0b0b0c; --fg:#e8e4da; --muted:#9e9a91; --line:#3a3833; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ink); color: var(--fg);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center;
    padding: clamp(2rem, 6vw, 5rem) 1.5rem;
  }
  main { width: 100%; max-width: 62rem; text-align: center; }
  .cover {
    width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block;
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  h1 { font-size: clamp(1.6rem, 4.2vw, 2.8rem); font-weight: 400; letter-spacing: .01em; line-height: 1.1; margin: 0 0 .3em; }
  .artist { font-size: clamp(.9rem, 2vw, 1.05rem); letter-spacing: .06em; color: var(--muted); margin: 0 0 clamp(1rem, 2.2vh, 1.5rem); }
  .amp { color: var(--gold); }
  .rule { width: 3rem; height: 1px; background: var(--line); margin: 2.4rem auto; }

  /* cover flanked by the streaming links, so nothing needs scrolling */
  .stage {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    justify-content: center;
    align-items: center;
    gap: clamp(1.2rem, 3.5vw, 2.8rem);
  }
  .stage .cover { width: 54vh; height: 54vh; }
  .side { display: flex; flex-direction: column; gap: .6rem; }
  .side.left { align-items: flex-end; }
  .side.right { align-items: flex-start; }
  .side:empty { display: none; }
  .btn {
    display: inline-flex; align-items: center; gap: .6rem;
    width: 100%; max-width: 12.5rem;
    padding: .7rem 1rem; border: 1px solid #4a4640; color: var(--fg);
    text-decoration: none; font-size: .85rem; letter-spacing: .06em;
    font-family: inherit; transition: border-color .15s, color .15s, background .15s;
    white-space: nowrap;
  }
  .side.left .btn { flex-direction: row-reverse; text-align: right; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
  .listen-note { color: var(--muted); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 clamp(1.1rem, 2.6vh, 1.8rem); }

  @media (max-width: 44rem) {
    .stage { grid-template-columns: 1fr; gap: .7rem; }
    .stage .side.left { order: 1; }
    .stage .side.right { order: 2; }
    .stage .cover { order: 3; margin-top: .7rem; }
    .stage .cover { width: min(100%, 20rem); height: auto; justify-self: center; }
    .side, .side.left, .side.right { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: stretch; }
    .side.left .btn { flex-direction: row; text-align: left; }
    .btn { width: auto; max-width: none; }
  }
  ol.tracks { list-style: none; padding: 0; margin: 0; text-align: left; }
  ol.tracks li {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: .85rem 0; border-bottom: 1px solid #1c1b19;
    font-size: 1rem; letter-spacing: .01em;
  }
  ol.tracks li:last-child { border-bottom: 0; }
  ol.tracks .n { color: #57544e; font-variant-numeric: tabular-nums; min-width: 1.2rem; }
  ol.tracks .t { flex: 1; }
  ol.tracks .d { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
  .note { color: var(--muted); font-size: .9rem; line-height: 1.7; margin: 0; }

</main>

<script>
/* ── Streaming links ────────────────────────────────────────────────
   Paste the URLs between the quotes. Any platform left empty is
   skipped automatically, so the page never shows a dead button.
   The links are split left/right of the cover, two on each side.
   ─────────────────────────────────────────────────────────────────── */
const LINKS = {
  apple:   "https://music.apple.com/us/album/the-message-single/6838480344",
  youtube: "https://music.youtube.com/watch?v=p61U0iRbv8c",
  spotify: "https://open.spotify.com/album/7akWyE7mBiIfJC6UWxUsBJ",
  boomplay:"https://www.boomplay.com/albums/EQWBvfaHJ8U1zLKIW9H667z2"
};

const NAMES = { apple: "Apple Music", youtube: "YouTube Music", spotify: "Spotify", boomplay: "Boomplay" };
const ICONS = {
  apple:   '<path d="M16.4 12.9c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.2 2.8 2.2 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7 2-1.1 2.7-2.1c.9-1.2 1.2-2.4 1.3-2.5-.1 0-2.2-.9-2.2-3.6zM14.1 5.9c.6-.8 1-1.8.9-2.9-.9.1-2 .6-2.7 1.4-.6.7-1 1.8-.9 2.8 1 .1 2-.5 2.7-1.3z"/>',
  youtube: '<path d="M12 5.2c3.5 0 5.9.2 6.9.5 1 .3 1.6.9 1.8 1.9.2 1 .3 2.4.3 4.4s-.1 3.4-.3 4.4c-.2 1-.8 1.6-1.8 1.9-1 .3-3.4.5-6.9.5s-5.9-.2-6.9-.5c-1-.3-1.6-.9-1.8-1.9-.2-1-.3-2.4-.3-4.4s.1-3.4.3-4.4c.2-1 .8-1.6 1.8-1.9 1-.3 3.4-.5 6.9-.5zm-1.9 3.6v6.4l5.4-3.2-5.4-3.2z"/>',
  spotify: '<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.3 14.4a.8.8 0 01-1.1.3c-3-1.8-6.7-2.2-11-1.2a.8.8 0 11-.4-1.5c4.7-1.1 8.8-.6 12.1 1.4.4.2.5.7.4 1zm1.1-2.6a1 1 0 01-1.3.3c-3.4-2.1-8.5-2.7-12.5-1.5a1 1 0 11-.6-1.9c4.6-1.4 10.3-.7 14.2 1.7.4.3.6.9.2 1.4zm.1-2.7C13.4 8.7 6.9 8.5 3.6 9.5a1.2 1.2 0 11-.7-2.3c3.9-1.2 11.1-.9 15.4 1.7a1.2 1.2 0 01-1.2 2.2z"/>',
  boomplay:'<path d="M4 10h2.4v4H4v-4zm3.6-3h2.4v10H7.6V7zm3.6-2.4h2.4v14.8h-2.4V4.6zm3.6 3h2.4v8.8h-2.4V7.6zm3.6 2.8H21v3.2h-2.6v-3.2z"/>'
};

const live = [];
const left = document.getElementById("side-left");
const right = document.getElementById("side-right");

/* one button per platform, alternating left / right of the cover */
const visible = Object.entries(LINKS).filter(([, u]) => u && u !== "#");
visible.forEach(([key, url], i) => {
  const a = document.createElement("a");
  a.className = "btn";
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[key] || "") + '</svg><span>' + NAMES[key] + '</span>';
  (i % 2 === 0 ? left : right).appendChild(a);
  live.push(NAMES[key]);
});

const note = document.getElementById("listen-note");
if (live.length === 1)      note.textContent = "Listen on " + live[0];
else if (live.length === 2) note.textContent = "Listen on " + live[0] + " and " + live[1];
else if (live.length > 2)   note.textContent = "Listen on " + live.slice(0,-1).join(", ") + " and " + live[live.length-1];
else                        note.textContent = "";
</script>
